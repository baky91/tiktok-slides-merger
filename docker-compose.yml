services:
  api:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    shm_size: "2gb"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3001
    ports:
      - "3000:80"
    restart: unless-stopped
    